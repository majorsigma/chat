name: CI

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  flutter_test:
    name: Set up SDK and get dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: "11.0"
          cache: "gradle"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"
          channel: "stable"
          cache: true

  build_apk:
    name: Build Android Artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: "17.0"
          cache: "gradle"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"
          channel: "stable"
          cache: true

      - name: Extract Version from pubspec.yaml
        id: extract_version
        shell: bash
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
          PUB_CACHE: ${{ env.PUB_CACHE }}
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Prepare Android signing
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 -d  > "${{ github.workspace }}/android/app/keystore.jks"

          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_ALIAS_PASSWORD}}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=../app/keystore.jks
          EOF

      - name: Clean Flutter Project
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Build AAB
        run: flutter build aab --release

      - name: Upload AAB
        id: upload_aab
        uses: actions/upload-artifact@v4
        with:
          name: GChat
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Release AAB
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          tag_name: "v${{ env.VERSION }}"
          files: build/app/outputs/bundle/release/app-release.aab

      - name: Upload AAB to Production Track
        id: upload_production
        uses: KevinRohn/github-action-upload-play-store@v1.0.0
        with:
          service_account_json: ${{ secrets.GC_SERVICE_ACCOUNT_JSON }}
          package_name: "com.gchat.app"
          aab_file_path: build/outputs/bundle/release/app-release.aab
          track: "production"
          release_status: "completed"
