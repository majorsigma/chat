name: CI

on:
  push:
    branches:
      - main

jobs:
  flutter_test:
    name: Set up SDK and get dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-java@v1
        with:
          java-version: "11.0"
          cache: "gradle"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"
          channel: "stable"
          cache: true
      - run: flutter pub get
      # - run: flutter test

  build_apk:
    name: Build Flutter (Android)
    # needs: [flutter_test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v1
        with:
          java-version: "17.0"
          cache: "gradle"

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.3"
          channel: "stable"
          cache: true

      - name: Get the Current Working Directory
        run: |
          pwd

      - name: Clean Flutter Project
        run: flutter clean

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release --flavor stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MuleEx Partner
          path: build/app/outputs/flutter-apk/app-stable-release.apk

      - name: Extract Version from pubspec.yaml
        id: extract_version
        shell: bash
        env:
          FLUTTER_ROOT: ${{ env.FLUTTER_ROOT }}
          PUB_CACHE: ${{ env.PUB_CACHE }}
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | awk '{print $2}')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Create Tag Release
        id: create-release
        uses: actions/create-release@v1
        with:
          tag_name: "v${{ env.VERSION }}"
          release_name: "Release ${{ github.run_number }}"
          body: ${{ github.event.commits[0].message }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload APK Build
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create-release.outputs.upload_url }}
          asset_path: "build/app/outputs/apk/release/app-release.apk"
          asset_name: "GChat-${{ env.VERSION }}.apk"
          asset_content_type: "application/vnd.android.package-archive"
        env:
          GITHUB_TOKEN: ${{ github.token }}
